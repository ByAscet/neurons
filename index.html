<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050505">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="Нейроны">
<title>Нейроны человека · 228</title>
<style>
:root {
  /* Темная тема (по умолчанию) */
  --bg: #050505;
  --text: #e0e0e0;
  --muted: #888888;
  --accent-line: rgba(255, 255, 255, 0.15);
  --vignette: rgba(0, 0, 0, 0.85);
  --grain-opacity: 0.05;
  --watermark: rgba(255, 255, 255, 0.04);
  --icon-filter: invert(1);
}

body.light-mode {
  /* Светлая тема (бумага/архив) */
  --bg: #f0f0f0;
  --text: #111111;
  --muted: #555555;
  --accent-line: rgba(0, 0, 0, 0.15);
  --vignette: rgba(255, 255, 255, 0.6);
  --grain-opacity: 0.03;
  --watermark: rgba(0, 0, 0, 0.04);
  --icon-filter: invert(0);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
  font-family: Georgia, 'Times New Roman', serif;
  transition: background-color 0.6s ease, color 0.6s ease;
  user-select: none; -webkit-user-select: none;
  touch-action: manipulation;
}

/* Кинематографичные эффекты */
#film-grain {
  position: fixed; inset: 0; z-index: 10; pointer-events: none;
  opacity: var(--grain-opacity);
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
  transition: opacity 0.6s ease;
}

#vignette {
  position: fixed; inset: 0; z-index: 9; pointer-events: none;
  box-shadow: inset 0 0 160px 60px var(--vignette);
  transition: box-shadow 0.6s ease;
}

/* Водяной знак */
.watermark {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-15deg);
  font-size: 15vw; font-weight: 700; letter-spacing: 0.1em; white-space: nowrap;
  color: var(--watermark); z-index: 0; pointer-events: none;
  font-family: 'Helvetica Neue', Arial, sans-serif;
  transition: color 0.6s ease;
}

/* Контент */
#stage { position: fixed; inset: 0; z-index: 2; overflow: hidden; }
.slide {
  position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center;
  padding: calc(env(safe-area-inset-top, 0px) + 4rem) 2rem calc(env(safe-area-inset-bottom, 0px) + 4rem) 2rem;
  opacity: 0; visibility: hidden; transform: translateY(10px);
  transition: opacity 0.8s ease, transform 0.8s ease;
}
.slide.active { opacity: 1; visibility: visible; transform: translateY(0); }

.inner { position: relative; z-index: 1; max-width: 100%; width: 100%; }

.kicker {
  font-family: 'Helvetica Neue', Arial, sans-serif;
  font-size: 0.7rem; letter-spacing: 0.25em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 1.2rem; font-weight: 500;
}

.title {
  font-size: clamp(1.6rem, 8vw, 2.6rem);
  font-weight: 400; line-height: 1.1; margin-bottom: 1.8rem;
  border-bottom: 1px solid var(--accent-line); padding-bottom: 1rem;
}

.body p {
  font-size: clamp(1rem, 4.2vw, 1.15rem);
  line-height: 1.65; color: var(--text); margin-bottom: 0.9rem;
  text-align: justify;
}

/* Настройки (Шестеренка) */
.settings-btn {
  position: fixed; top: calc(env(safe-area-inset-top, 0px) + 1rem); right: 1.5rem;
  width: 44px; height: 44px; z-index: 20;
  display: flex; align-items: center; justify-content: center;
  background: transparent; border: none; cursor: pointer;
  opacity: 0.5; transition: opacity 0.3s, transform 0.4s;
}
.settings-btn:active { transform: rotate(90deg); opacity: 1; }
.settings-btn svg {
  width: 24px; height: 24px; stroke: var(--text);
  fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;
  transition: stroke 0.6s ease;
}

/* Клик-зоны для навигации */
.click-zones { position: fixed; inset: 0; z-index: 5; display: flex; }
.click-zones > div { height: 100%; }
.zone-left { width: 30%; }
.zone-right { width: 30%; margin-left: auto; }
.zone-center { width: 40%; pointer-events: none; }
</style>
</head>
<body>

<div class="watermark">NEURON</div>
<div id="vignette"></div>
<div id="film-grain"></div>

<button class="settings-btn" id="theme-toggle" aria-label="Сменить тему">
  <svg viewBox="0 0 24 24">

  </svg>
</button>

<main id="stage"></main>

<div class="click-zones">
  <div class="zone-left" id="btn-prev"></div>
  <div class="zone-center"></div>
  <div class="zone-right" id="btn-next"></div>
</div>

<script>
/* ================================

const slides = [
{s:"Пролог",t:"Нейроны человека",b:[

{s:"Пролог",t:"Зачем этот путь",b:[

{s:"Пролог",t:"Что вы узнаете",b:[

{s:"Пролог",t:"Почему это важно сейчас",b:[

{s:"Пролог",t:"Что такое нейрон — кратко",b:[

{s:"Пролог",t:"Масштаб",b:[

{s:"Пролог",t:"Связь с кибербезопасностью",b:[

{s:"Пролог",t:"Как читать эту презентацию",b:[

{s:"Истоки",t:"Первые представления о мозге",b:[

{s:"Истоки",t:"Гиппократ и мозг",b:[

{s:"Истоки",t:"Декарт и рефлекс",b:[

{s:"Истоки",t:"Гальванизм",b:[

{s:"Истоки",t:"Спор Гольджи и Кахаля",b:[

"Энтропия измеряет неопределённость.",
"Связь с нейронами: мозг тоже передаёт и сжимает информацию."]},
{s:"Кибернетика",t:"Бит и нейрон",b:[
"Нейрон передаёт импульсы — по сути, бинарные события.",
"Частота импульсов несёт аналоговую информацию.",
"Так цифровое и аналоговое сливаются в одной клетке."]},
{s:"Кибернетика",t:"Истоки кибербезопасности",b:[
"Первые системы защиты появляются вместе с сетями.",
"Криптография старше компьютеров на тысячи лет.",
"Но именно сети сделали защиту массовой необходимостью."]},
{s:"Кибербезопасность",t:"Первые хакеры MIT",b:[
"1950–60-е: студенты MIT исследуют машины ради любопытства.",
"«Хакер» тогда — энтузиаст, а не преступник.",
"Культура любопытства позже столкнётся с этикой."]},
{s:"Кибербезопасность",t:"ARPANET",b:[
"1969 год: запущена первая сеть с коммутацией пакетов.",
"Она соединяет университеты и военные центры.",
"С неё начинается интернет и его уязвимости."]},
{s:"Кибербезопасность",t:"Первый сетевой червь",b:[
"1988 год: червь Морриса заражает тысячи машин.",
"Он использует ошибки в sendmail и finger.",
"Это первый громкий инцидент сетевой безопасности."]},
{s:"Кибербезопасность",t:"Урок червя Морриса",b:[
"После него создаётся CERT — команда реагирования на инциденты.",
"Безопасность становится отдельной дисциплиной.",
"Ошибка в коде может стоить миллионов."]},
{s:"Анатомия",t:"Строение нейрона",b:[
"Тело клетки, дендриты, аксон и синаптические окончания.",
"Каждая часть выполняет свою роль в потоке сигнала.",
"Форма нейрона отражает его функцию."]},
{s:"Анатомия",t:"Сома — тело клетки",b:[
"Содержит ядро и основные органеллы.",
"Здесь синтезируются белки и происходят метаболические процессы.",
"Диаметр — от 4 до 100 микрометров."]},
{s:"Анатомия",t:"Ядро нейрона",b:[
"Хранит ДНК и управляет экспрессией генов.",
"Нейроны почти не делятся — ядро работает всю жизнь.",
"Повреждение ядра необратимо."]},
{s:"Анатомия",t:"Мембрана",b:[
"Двойной слой липидов толщиной около 5 нанометров.",
"Она разделяет заряды и создаёт потенциал покоя.",
"Встроенные белки работают как каналы и насосы."]},
{s:"Анатомия",t:"Липидный бислой",b:[
"Гидрофильные головки наружу, гидрофобные хвосты внутрь.",
"Мембрана — не стена, а динамическая среда.",
"Она пропускает одни ионы и блокирует другие."]},
{s:"Анатомия",t:"Дендриты",b:[
"Ветвящиеся отростки, принимающие сигналы.",
"Их форма напоминает дерево — отсюда название.",
"Один нейрон может иметь тысячи дендритных ветвей."]},
{s:"Анатомия",t:"Дендритные шипики",b:[
"Микроскопические выросты на дендритах.",
"На них образуются возбуждающие синапсы.",
"Их форма меняется при обучении."]},
{s:"Анатомия",t:"Аксон",b:[
"Длинный отросток, передающий сигнал от тела клетки.",
"Длина — от долей миллиметра до метра.",
"Один нейрон имеет только один аксон."]},
{s:"Анатомия",t:"Аксональный холмик",b:[
"Место, где аксон отходит от сомы.",
"Здесь начинается потенциал действия.",
"Высокая плотность натриевых каналов."]},
{s:"Анатомия",t:"Миелиновая оболочка",b:[
"Жировая изоляция вокруг аксона.",
"Она ускоряет проведение сигнала в десятки раз.",
"Образуется олигодендроцитами и шванновскими клетками."]},
{s:"Анатомия",t:"Перехваты Ранвье",b:[
"Разрывы в миелиновой оболочке.",
"В них сосредоточены ионные каналы.",
"Сигнал «перепрыгивает» между ними."]},
{s:"Анатомия",t:"Аксональный транспорт",b:[
"По аксону движутся везикулы с белками и митохондрии.",
"Быстрый транспорт — до 400 мм в сутки.",
"Медленный — около 1–5 мм в сутки."]},
{s:"Анатомия",t:"Синаптические терминали",b:[
"Разветвления аксона на конце.",
"Они образуют синапсы с другими клетками.",
"Здесь хранятся нейротрансмиттеры."]},
{s:"Анатомия",t:"Синапс",b:[
"Место контакта двух нейронов.",
"Состоит из пресинаптической и постсинаптической мембран.",
"Щель между ними — около 20–40 нанометров."]},
{s:"Анатомия",t:"Типы синапсов",b:[
"Аксо-дендритные, аксо-соматические, аксо-аксональные.",
"Химические и электрические.",
"Каждый тип — своя логика передачи."]},
{s:"Электрофизиология",t:"Ионные каналы",b:[
"Белковые поры в мембране.",
"Избирательно пропускают Na⁺, K⁺, Ca²⁺ или Cl⁻.",
"Открываются по напряжению, лиганду или механически."]},
{s:"Электрофизиология",t:"Натрий-калиевый насос",b:[
"Выкачивает 3 иона Na⁺ наружу и закачивает 2 иона K⁺ внутрь.",
"Тратит АТФ — энергию клетки.",
"Создаёт и поддерживает потенциал покоя."]},
{s:"Электрофизиология",t:"Мембранный потенциал покоя",b:[
"Внутри клетки — около −70 мВ относительно внешней среды.",
"Возникает из-за разницы концентраций ионов.",
"Это «состояние готовности» нейрона."]},
{s:"Электрофизиология",t:"Уравнение Нернста",b:[
"Связывает концентрацию иона с равновесным потенциалом.",
"Позволяет рассчитать вклад одного иона.",
"Основа количественной электрофизиологии."]},
{s:"Электрофизиология",t:"Уравнение Гольдмана",b:[
"Учитывает проницаемость мембраны для нескольких ионов.",
"Более точное описание потенциала покоя.",
"Введено в 1943 году Дэвидом Гольдманом."]},
{s:"Электрофизиология",t:"Порог возбуждения",b:[
"Критический уровень деполяризации — около −55 мВ.",
"Если достигнут — запускается потенциал действия.",
"Если нет — сигнал затухает."]},
{s:"Электрофизиология",t:"Деполяризация",b:[
"Быстрое открытие натриевых каналов.",
"Ионы Na⁺ входят в клетку, заряд становится положительным.",
"Мембрана «перезаряжается»."]},
{s:"Электрофизиология",t:"Потенциал действия",b:[
"Кратковременный электрический импульс.",
"Длится около 1–2 миллисекунд.",
"Амплитуда — около 100 мВ."]},
{s:"Электрофизиология",t:"Фазы потенциала действия",b:[
"Деполяризация, овершут, реполяризация, гиперполяризация.",
"Каждая фаза — своя конфигурация каналов.",
"Форма сигнала строго воспроизводима."]},
{s:"Электрофизиология",t:"Реполяризация",b:[
"Натриевые каналы закрываются, калиевые открываются.",
"K⁺ выходит из клетки, заряд возвращается к отрицательному.",
"Нейрон готовится к новому импульсу."]},
{s:"Электрофизиология",t:"Гиперполяризация",b:[
"Кратковременное «переохлаждение» мембраны ниже покоя.",
"Калиевые каналы закрываются медленно.",
"Затем потенциал возвращается к норме."]},
{s:"Электрофизиология",t:"Рефрактерность",b:[
"Абсолютная фаза: нейрон не может сработать снова.",
"Относительная фаза: нужен более сильный стимул.",
"Ограничивает максимальную частоту импульсов."]},
{s:"Электрофизиология",t:"Распространение потенциала",b:[
"Импульс бежит по аксону без затухания.",
"Каждый участок мембраны возбуждается заново.",
"Принцип «всё или ничего»."]},
{s:"Электрофизиология",t:"Сальтаторная проводимость",b:[
"Сигнал «перепрыгивает» от перехвата к перехвату.",
"Скорость возрастает до 120 м/с.",
"Экономия энергии и места."]},
{s:"Электрофизиология",t:"Скорость проведения",b:[
"Без миелина — 0,5–2 м/с.",
"С миелином — до 120 м/с.",
"Диаметр аксона также влияет на скорость."]},
{s:"Электрофизиология",t:"Миелинизация",b:[
"Происходит в течение первых лет жизни.",
"Завершается к 20–25 годам в лобных долях.",
"Влияет на скорость мышления и обучения."]},
{s:"Электрофизиология",t:"Демиелинизация",b:[
"Разрушение миелиновой оболочки.",
"Приводит к замедлению и сбоям сигналов.",
"Лежит в основе ряда неврологических заболеваний."]},
{s:"Электрофизиология",t:"Рассеянный склероз",b:[
"Аутоиммунное заболевание, атакующее миелин.",
"Симптомы: слабость, нарушение координации, зрения.",
"Пример того, как важен каждый слой изоляции."]},
{s:"Синапс",t:"Химический синапс",b:[
"Сигнал передаётся через нейротрансмиттеры.",
"Медленнее электрического, но гибче.",
"Основной тип синапсов в мозге человека."]},
{s:"Синапс",t:"Электрический синапс",b:[
"Клетки соединены щелевыми контактами.",
"Сигнал проходит почти мгновенно.",
"Быстрее, но менее управляем."]},
{s:"Синапс",t:"Кальциевые каналы",b:[
"Приход импульса открывает Ca²⁺-каналы.",
"Кальций запускает слияние везикул с мембраной.",
"Без кальция синапс «молчит»."]},
{s:"Синапс",t:"Экзоцитоз",b:[
"Везикула сливается с пресинаптической мембраной.",
"Нейротрансмиттер выбрасывается в щель.",
"Процесс занимает доли миллисекунды."]},
{s:"Синапс",t:"Нейротрансмиттеры",b:[
"Химические посредники между нейронами.",
"Более 100 известных веществ.",
"Каждый имеет свои рецепторы и эффекты."]},
{s:"Синапс",t:"Синаптические везикулы",b:[
"Пузырьки диаметром около 40 нанометров.",
"Содержат от нескольких сотен до тысяч молекул.",
"Собираются в активных зонах терминали."]},
{s:"Синапс",t:"Синаптическая щель",b:[
"Пространство шириной 20–40 нанометров.",
"Через него диффундирует нейротрансмиттер.",
"Тонкая настройка расстояния влияет на силу связи."]},
{s:"Синапс",t:"Рецепторы",b:[
"Белки на постсинаптической мембране.",
"Связывают нейротрансмиттер и меняют состояние клетки.",
"Определяют, будет сигнал возбуждающим или тормозным."]},
{s:"Синапс",t:"Ионотропные рецепторы",b:[
"Сами являются ионными каналами.",
"Открываются при связывании лиганда.",
"Быстрый ответ — миллисекунды."]},
{s:"Синапс",t:"Метаботропные рецепторы",b:[
"Работают через G-белки и вторичные посредники.",
"Ответ медленнее, но длительнее.",
"Модулируют состояние целых сетей."]},
{s:"Синапс",t:"Возбуждающий постсинаптический потенциал",b:[
"ВПСП — кратковременная деполяризация.",
"Возникает при входе Na⁺ или Ca²⁺.",
"Повышает шанс, что нейрон сработает."]},
{s:"Синапс",t:"Тормозный постсинаптический потенциал",b:[
"ТПСП — гиперполяризация мембраны.",
"Возникает при входе Cl⁻ или выходе K⁺.",
"Снижает вероятность импульса."]},
{s:"Синапс",t:"Суммация",b:[
"Нейрон складывает все входы.",
"Решение принимается на аксонном холмике.",
"Это основа нейронного «вычисления»."]},
{s:"Синапс",t:"Пространственная суммация",b:[
"Складываются сигналы от разных синапсов.",
"Чем больше активных входов — тем сильнее деполяризация.",
"Геометрия дендритов имеет значение."]},
{s:"Синапс",t:"Временная суммация",b:[
"Сигналы от одного синапса складываются во времени.",
"Быстрые повторные импульсы накапливаются.",
"Частота становится решающей."]},
{s:"Синапс",t:"Интеграция сигнала",b:[
"Нейрон — аналоговый интегратор с порогом.",
"Результат — либо импульс, либо тишина.",
"Простая логика, порождающая сложное поведение."]},
{s:"Синапс",t:"Обратный захват",b:[
"Нейротрансмиттер возвращается в пресинаптическую клетку.",
"Так сигнал быстро прекращается.",
"Мишень многих лекарств и антидепрессантов."]},
{s:"Нейротрансмиттеры",t:"Классификация",b:[
"Аминокислоты, моноамины, пептиды, газы, липиды.",
"Более 100 известных молекул.",
"У каждой — своя система рецепторов."]},
{s:"Нейротрансмиттеры",t:"Ацетилхолин",b:[
"Первый открытый нейротрансмиттер.",
"Работает в нервно-мышечных синапсах.",
"Участвует в памяти и внимании."]},
{s:"Нейротрансмиттеры",t:"Дофамин",b:[
"Отвечает за мотивацию, награду и движение.",
"Связан с болезнью Паркинсона и зависимостями.",
"Один из самых изученных медиаторов."]},
{s:"Нейротрансмиттеры",t:"Серотонин",b:[
"Регулирует настроение, сон и аппетит.",
"Мишень антидепрессантов группы СИОЗС.",
"Синтезируется из триптофана."]},
{s:"Нейротрансмиттеры",t:"Норадреналин",b:[
"Участвует в реакции «бей или беги».",
"Повышает бодрость и концентрацию.",
"Вырабатывается в голубом пятне."]},
{s:"Нейротрансмиттеры",t:"ГАМК",b:[
"Главный тормозный медиатор мозга.",
"Снижает возбудимость нейронов.",
"Связана с тревожностью и сном."]},
{s:"Нейротрансмиттеры",t:"Глицин",b:[
"Тормозный медиатор спинного мозга и ствола.",
"Также участвует в обмене веществ.",
"Простая молекула с сильным эффектом."]},
{s:"Нейротрансмиттеры",t:"Глутамат",b:[
"Главный возбуждающий медиатор.",
"Участвует в обучении и памяти.",
"Избыток токсичен для нейронов."]},
{s:"Нейротрансмиттеры",t:"Эндорфины",b:[
"Внутренние опиоиды, снижающие боль.",
"Выделяются при стрессе и физической нагрузке.",
"Создают чувство эйфории."]},
{s:"Нейротрансмиттеры",t:"Нейропептиды",b:[
"Короткие цепочки аминокислот.",
"Модулируют настроение, боль и социальное поведение.",
"Окситоцин и вазопрессин — яркие примеры."]},
{s:"Нейротрансмиттеры",t:"Оксид азота",b:[
"Газообразный медиатор.",
"Проникает через мембраны и действует локально.",
"Участвует в расширении сосудов."]},
{s:"Нейротрансмиттеры",t:"Эндоканнабиноиды",b:[
"Ретроградные медиаторы — работают «назад».",
"Модулируют синаптическую пластичность.",
"Связаны с болью, памятью и аппетитом."]},
{s:"Типы нейронов",t:"Классификации",b:[
"По числу отростков, по функции, по медиатору.",
"По форме и расположению в мозге.",
"Единой «главной» классификации нет."]},
{s:"Типы нейронов",t:"Униполярные",b:[
"Один отросток, выполняющий обе роли.",
"Встречаются у беспозвоночных.",
"Редки у человека."]},
{s:"Типы нейронов",t:"Биполярные",b:[
"Один дендрит и один аксон.",
"Характерны для сетчатки и обонятельной системы.",
"Компактны и специализированы."]},
{s:"Типы нейронов",t:"Мультиполярные",b:[
"Много дендритов и один аксон.",
"Большинство нейронов мозга — такие.",
"Пирамидные клетки коры — классический пример."]},
{s:"Типы нейронов",t:"Псевдоуниполярные",b:[
"Один отросток, который делится на два.",
"Типичны для спинальных ганглиев.",
"Передают сенсорную информацию."]},
{s:"Типы нейронов",t:"Сенсорные нейроны",b:[
"Принимают сигналы от рецепторов.",
"Передают информацию в центральную нервную систему.",
"Пример: кожные механорецепторы."]},
{s:"Типы нейронов",t:"Моторные нейроны",b:[
"Передают команды мышцам и железам.",
"Тела находятся в спинном мозге и стволе.",
"Один мотонейрон управляет десятками волокон."]},
{s:"Типы нейронов",t:"Интернейроны",b:[
"Связывают нейроны внутри мозга.",
"Составляют большинство клеток коры.",
"Обеспечивают торможение и интеграцию."]},
{s:"Типы нейронов",t:"Пирамидные клетки",b:[
"Главные проекционные нейроны коры.",
"Имеют крупное тело в форме пирамиды.",
"Их аксоны идут в другие области мозга."]},
{s:"Типы нейронов",t:"Клетки Пуркинье",b:[
"Крупные нейроны мозжечка.",

/* ================================
   ЛОГИКА
   ================================ */
const stage = document.getElementById('stage');
const nodes = slides.map((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide';
  const ps = s.b.map(l => `<p>${l}</p>`).join('');
  el.innerHTML = `<div class="inner">
    <div class="kicker">${s.s}</div>
    <h2 class="title">${s.t}</h2>
    <div class="body">${ps}</div>
  </div>`;
  stage.appendChild(el);
  return el;
});

let idx = 0;
const STORE_KEY = 'noir-neuro-idx';

function show(i){
  i = Math.max(0, Math.min(slides.length-1, i));
  nodes.forEach((n,k)=>{ if(k!==i) n.classList.remove('active'); });
  nodes[i].classList.add('active');
  idx = i;
  try{ localStorage.setItem(STORE_KEY, String(i)); }catch(e){}
}

let restored = 0;
try{ restored = parseInt(localStorage.getItem(STORE_KEY)||'0',10)||0; }catch(e){}
show(restored);

/* Навигация кликами */
document.getElementById('btn-prev').addEventListener('click', ()=> show(idx-1));
document.getElementById('btn-next').addEventListener('click', ()=> show(idx+1));

/* Клавиатура (для десктопа) */
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){ e.preventDefault(); show(idx+1); }
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); show(idx-1); }
});

/* Смена темы */
const themeBtn = document.getElementById('theme-toggle');
let isLight = false;
try { isLight = localStorage.getItem('noir-theme') === 'light'; } catch(e) {}

if (isLight) {
  document.body.classList.add('light-mode');
}

themeBtn.addEventListener('click', (e) => {
  e.stopPropagation(); // чтобы не перелистывался слайд
  document.body.classList.toggle('light-mode');
  isLight = document.body.classList.contains('light-mode');
  try { localStorage.setItem('noir-theme', isLight ? 'light' : 'dark'); } catch(e) {}
});

/* Блокировка случайного зума и скролла на iOS */
document.addEventListener('touchmove', e => {
  if(e.touches.length === 1) e.preventDefault();
}, {passive:false});
</script>
