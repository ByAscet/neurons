<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a0d12">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Нейроны">
<meta name="format-detection" content="telephone=no">
<title>Нейроны человека · 228</title>
<style>
:root{
  --bg:#0a0d12;
  --text:#e9eef5;
  --muted:#8892a4;
  --soft:#c6cfdb;
  --accent:#4fd1c5;
  --accent2:#f0b566;
  --accent3:#a78bfa;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{
  height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Inter',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
  touch-action:manipulation;
  user-select:none;-webkit-user-select:none;
  -webkit-text-size-adjust:100%;
}
html,body{height:100dvh}
#stage{position:fixed;inset:0;overflow:hidden}

.slide{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  justify-content:center;
  padding:calc(var(--safe-t) + 3.5rem) 1.35rem calc(var(--safe-b) + 5.5rem) 1.35rem;
  opacity:0;visibility:hidden;
  transform:translate3d(0,0,0);
  transition:opacity .45s ease, transform .6s cubic-bezier(.22,.7,.22,1);
  will-change:opacity,transform;
}
.slide.active{opacity:1;visibility:visible}
.slide::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none}
.bg-0::before{background:
  radial-gradient(120% 60% at 10% 8%, rgba(79,209,197,.13), transparent 60%),
  radial-gradient(120% 60% at 95% 95%, rgba(167,139,250,.10), transparent 60%)}
.bg-1::before{background:
  radial-gradient(120% 60% at 95% 8%, rgba(240,181,102,.12), transparent 60%),
  radial-gradient(120% 60% at 5% 95%, rgba(79,209,197,.09), transparent 60%)}
.bg-2::before{background:
  radial-gradient(120% 60% at 50% 98%, rgba(167,139,250,.13), transparent 60%),
  radial-gradient(120% 60% at 15% 5%, rgba(79,209,197,.08), transparent 60%)}
.bg-3::before{background:
  radial-gradient(120% 60% at 8% 55%, rgba(79,209,197,.11), transparent 60%),
  radial-gradient(120% 60% at 95% 30%, rgba(240,181,102,.09), transparent 60%)}

.inner{position:relative;z-index:1;max-width:100%;width:100%}
.kicker{
  font-size:.68rem;letter-spacing:.24em;text-transform:uppercase;
  color:var(--accent);margin-bottom:.9rem;font-weight:600;
}
.title{
  font-size:clamp(1.45rem,7.2vw,2.15rem);
  font-weight:600;letter-spacing:-.015em;
  line-height:1.18;margin-bottom:1.2rem;color:#f2f6fb;
}
.body p{
  font-size:clamp(.94rem,4.05vw,1.06rem);
  line-height:1.62;color:var(--soft);
  margin-bottom:.72rem;
  padding-left:.85rem;
  position:relative;
}
.body p::before{
  content:"";position:absolute;left:0;top:.72em;
  width:.4rem;height:1px;background:var(--accent);opacity:.7;
}
.body p:first-child{color:var(--text)}
.body p:last-child{margin-bottom:0}

/* Анимация появления */
.kicker,.title,.body p{opacity:0}
.slide.active .kicker{animation:rise .55s .05s both}
.slide.active .title{animation:rise .7s .13s both}
.slide.active .body p:nth-child(1){animation:rise .65s .26s both}
.slide.active .body p:nth-child(2){animation:rise .65s .36s both}
.slide.active .body p:nth-child(3){animation:rise .65s .46s both}
.slide.active .body p:nth-child(4){animation:rise .65s .56s both}
.slide.active .body p:nth-child(5){animation:rise .65s .66s both}
@keyframes rise{from{opacity:0;transform:translate3d(0,14px,0)}to{opacity:1;transform:none}}

/* HUD */
.progress{
  position:fixed;top:0;left:0;right:0;
  height:calc(var(--safe-t) + 3px);
  padding-top:var(--safe-t);
  background:transparent;z-index:6;pointer-events:none;
}
.progress-bar{
  height:3px;width:0;
  background:linear-gradient(90deg,var(--accent),var(--accent3));
  transition:width .45s cubic-bezier(.22,.7,.22,1);
  border-radius:0 2px 2px 0;
}
.hud{
  position:fixed;
  top:calc(var(--safe-t) + .55rem);
  left:0;right:0;
  display:flex;justify-content:space-between;align-items:center;
  padding:0 1.15rem;
  font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;
  color:var(--muted);z-index:5;pointer-events:none;
}
.hud .section{color:var(--accent);font-weight:600;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hud .counter{font-variant-numeric:tabular-nums;font-weight:500}

/* Нижняя панель */
.nav{
  position:fixed;left:0;right:0;
  bottom:0;
  padding:.7rem 1rem calc(var(--safe-b) + .7rem) 1rem;
  display:flex;gap:.6rem;align-items:center;
  background:linear-gradient(to top, rgba(10,13,18,.92), rgba(10,13,18,0));
  z-index:7;
  pointer-events:none;
}
.nav > *{pointer-events:auto}
.btn{
  flex:1;
  height:2.6rem;
  border-radius:1.3rem;
  border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.04);
  color:var(--text);
  font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;font-weight:600;
  display:flex;align-items:center;justify-content:center;
  transition:background .2s, transform .12s, border-color .2s;
  font-family:inherit;
  -webkit-appearance:none;
}
.btn:active{transform:scale(.97);background:rgba(79,209,197,.14);border-color:rgba(79,209,197,.4)}
.btn:disabled{opacity:.3}
.btn.icon{
  flex:0 0 2.6rem;font-size:1rem;letter-spacing:0;
}
.slider{
  flex:1;
  height:2.6rem;
  display:flex;align-items:center;gap:.4rem;
  color:var(--muted);font-size:.62rem;letter-spacing:.18em;
  font-variant-numeric:tabular-nums;
  justify-content:center;
}
.slider b{color:var(--text);font-weight:600;font-size:.7rem}

/* Тап-зоны (невидимые) */
.tapzones{position:fixed;inset:0;z-index:4;display:flex}
.tapzones > div{flex:1}
.tapzones .l{flex:0 0 30%}
.tapzones .r{flex:0 0 30%}
.tapzones .c{flex:1;pointer-events:none}

/* Индикатор свайпа — минимальный */
.swipe-hint{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(var(--safe-b) + 4.2rem);
  font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;
  color:rgba(136,146,164,.5);z-index:6;pointer-events:none;
  transition:opacity .5s ease;
  white-space:nowrap;
}
.swipe-hint.fade{opacity:0}
</style>
</head>
<body>
<div class="progress"><div class="progress-bar" id="pb"></div></div>
<header class="hud">
  <div class="section" id="sect">Пролог</div>
  <div class="counter"><span id="cur">1</span> / <span id="tot">228</span></div>
</header>

<main id="stage"></main>

<div class="tapzones" id="tapzones">
  <div class="l" data-dir="-1"></div>
  <div class="c"></div>
  <div class="r" data-dir="1"></div>
</div>

<div class="swipe-hint" id="hint">Свайп ← → · тап по краям</div>

<nav class="nav">
  <button class="btn icon" id="prev" aria-label="Назад">‹</button>
  <div class="slider"><span id="chapter">Пролог</span></div>
  <button class="btn icon" id="next" aria-label="Вперёд">›</button>
</nav>

<script>
/* ================================
   ДАННЫЕ: 228 слайдов
   ================================ */
const slides = [
/* 1—8 · Пролог */
{s:"Пролог",t:"Нейроны человека",b:[
"228 слайдов о клетках, из которых соткано всё, что мы называем собой.",
"От лягушачьих лапок Гальвани до архитектур современной кибербезопасности.",
"Медленное, вдумчивое погружение — без спешки и без упрощений."]},
{s:"Пролог",t:"Зачем этот путь",b:[
"Нейрон — мост между биологией, вычислением и защитой информации.",
"Понимая его, мы понимаем и машины, и собственные уязвимости.",
"Каждый слайд — самостоятельная тема, но вместе они складываются в карту."]},
{s:"Пролог",t:"Что вы узнаете",b:[
"Анатомию и физиологию нейрона — от мембраны до аксона.",
"Историю нейронауки: Гальвани, Кахаль, Ходжкин, Хаксли.",
"Как из нейрона выросли кибернетика, перцептрон и искусственный интеллект."]},
{s:"Пролог",t:"Почему это важно сейчас",b:[
"Нейроинтерфейсы выходят из лабораторий в клиники и в быт.",
"ИИ-системы уже обучаются на биологических принципах.",
"Кибербезопасность всё чаще сталкивается с нейроданными и нейроустройствами."]},
{s:"Пролог",t:"Что такое нейрон — кратко",b:[
"Электрически возбудимая клетка, передающая сигналы другим клеткам.",
"Основа нервной системы — от спинного мозга до коры больших полушарий.",
"Единица вычисления, сравнимая по сложности с целой вычислительной схемой."]},
{s:"Пролог",t:"Масштаб",b:[
"Около 86 миллиардов нейронов в человеческом мозге.",
"Порядка 100–1000 триллионов синаптических связей.",
"Потребление энергии — примерно 20 ватт, как у тусклой лампочки."]},
{s:"Пролог",t:"Связь с кибербезопасностью",b:[
"Нейронные сети — источник вдохновения для систем обнаружения атак.",
"Мозг — самая защищённая система, известная биологии.",
"Изучая её, мы перенимаем принципы устойчивости и адаптации."]},
{s:"Пролог",t:"Как читать эту презентацию",b:[
"Каждый слайд — одна мысль, один слой глубины.",
"Свайп влево — вперёд, вправо — назад. Тап по краям экрана делает то же.",
"Не торопитесь: темп важнее скорости."]},

/* 9—30 · Истоки */
{s:"Истоки",t:"Первые представления о мозге",b:[
"Древние египтяне считали сердце вместилищем разума, а мозг — «наполнителем черепа».",
"Мозг упоминался в папирусах Эдвина Смита около 1700 года до н. э.",
"Но системного знания о нейронах не было ещё тысячелетия."]},
{s:"Истоки",t:"Гиппократ и мозг",b:[
"V век до н. э.: Гиппократ помещает источник ощущений и мыслей в мозг.",
"Он отделяет эпилепсию от «божественного» и связывает её с мозгом.",
"Первое рациональное описание роли мозга в западной традиции."]},
{s:"Истоки",t:"Гален и пневма",b:[
"II век: Гален описывает мозг, нервы и желудочки.",
"Он вводит понятие «пневмы» — дыхания, текущего по нервам.",
"Его модель продержится почти 1400 лет."]},
{s:"Истоки",t:"Везалий и анатомия",b:[
"1543 год: Андреас Везалий публикует «De humani corporis fabrica».",
"Точные иллюстрации мозга и нервов меняют медицину.",
"Наблюдение вытесняет догму."]},
{s:"Истоки",t:"Декарт и рефлекс",b:[
"XVII век: Декарт описывает рефлекс как механический ответ.",
"Дух и тело разделены, но нерв — уже «трубка» с потоками.",
"Идея автоматического ответа переживёт века."]},
{s:"Истоки",t:"Микроскоп меняет всё",b:[
"XVII век: микроскоп открывает невидимый мир ткани.",
"Появляются первые изображения тонких волокон в нервах.",
"Без оптики не было бы нейронауки."]},
{s:"Истоки",t:"Левенгук",b:[
"Антони ван Левенгук описывает нервные волокна при большом увеличении.",
"Он видит «трубочки» внутри нервов и мышечных волокон.",
"Наблюдение готовит почву для будущей клеточной теории."]},
{s:"Истоки",t:"Гальванизм",b:[
"Конец XVIII века: Луиджи Гальвани исследует «животное электричество».",
"Опыты с лягушачьими лапками потрясли научный мир.",
"Электричество впервые связывают с живой тканью."]},
{s:"Истоки",t:"Лягушачьи лапки",b:[
"Гальвани подвешивает лапки на медных крючках к железной решётке.",
"Мышцы сокращаются при контакте — будто от «молнии».",
"Случайное наблюдение открывает новую эпоху."]},
{s:"Истоки",t:"Спор Гальвани и Вольты",b:[
"Алессандро Вольта считает, что источник тока — металлы, а не ткань.",
"Спор порождает вольтов столб — первую батарею.",
"Так биология подарила миру электротехнику."]},
{s:"Истоки",t:"XIX век: рождение нейроанатомии",b:[
"Анатомы описывают серое и белое вещество, ядра и проводящие пути.",
"Микротом и красители позволяют видеть отдельные клетки.",
"Нейрон становится объектом наблюдения."]},
{s:"Истоки",t:"Ретикулярная теория",b:[
"Господствующая идея XIX века: нервная система — единая сеть.",
"Считалось, что волокна сливаются в непрерывную «сеть-протоплазму».",
"Альтернатива — клеточная теория — ещё впереди."]},
{s:"Истоки",t:"Камилло Гольджи",b:[
"1873 год: Гольджи разрабатывает «чёрную реакцию» — окраску серебром.",
"Метод позволяет увидеть нейрон целиком, с отростками.",
"За это он получит Нобелевскую премию."]},
{s:"Истоки",t:"Нейронная доктрина",b:[
"Идея: нервная система состоит из отдельных клеток — нейронов.",
"Они контактируют, но не сливаются друг с другом.",
"Это основа всей современной нейробиологии."]},
{s:"Истоки",t:"Сантьяго Рамон-и-Кахаль",b:[
"Испанский анатом, усовершенствовавший метод Гольджи.",
"Он доказывает: каждый нейрон — отдельная клетка.",
"Он описывает дендриты, аксоны и направление сигнала."]},
{s:"Истоки",t:"Спор Гольджи и Кахаля",b:[
"Гольджи верит в единую сеть, Кахаль — в отдельные клетки.",
"Оба получают Нобелевскую премию 1906 года.",
"История подтверждает правоту Кахаля."]},
{s:"Истоки",t:"Нобелевская премия 1906",b:[
"Вручена Гольджи и Кахалю за изучение нервной системы.",
"Оба выступили с лекциями, где повторили противоположные взгляды.",
"Наука движется спорами, а не согласием."]},
{s:"Истоки",t:"Шеррингтон и синапс",b:[
"Чарльз Шеррингтон вводит термин «синапс» в 1897 году.",
"Он описывает интеграцию сигналов в спинном мозге.",
"Рефлекторная дуга становится рабочей моделью."]},
{s:"Истоки",t:"Термин «синапс»",b:[
"От греческого «соединять, смыкать».",
"Сначала — гипотеза о разрыве между нейронами.",
"Позже — подтверждённая электронной микроскопией реальность."]},
{s:"Истоки",t:"Эдгар Адриан и потенциал действия",b:[
"1920-е: Адриан регистрирует одиночные импульсы в нервном волокне.",
"Он показывает: сила сигнала кодируется частотой импульсов.",
"Это принцип «всё или ничего» в действии."]},
{s:"Истоки",t:"Ходжкин и Хаксли",b:[
"1952 год: Алан Ходжкин и Эндрю Хаксли моделируют потенциал действия.",
"Они используют гигантский аксон кальмара.",
"Их уравнения — фундамент вычислительной нейронауки."]},
{s:"Истоки",t:"Аксон кальмара",b:[
"Диаметр до 1 мм — виден невооружённым глазом.",
"Позволяет вставить электроды и измерить токи.",
"Биология большого моллюска объяснила работу нашего мозга."]},
{s:"Истоки",t:"Нобелевская премия 1963",b:[
"Ходжкин, Хаксли и Экклс получают премию за ионные механизмы.",
"Экклс исследует синаптическую передачу.",
"Трио завершает классическую картину нейрона."]},
{s:"Истоки",t:"От клетки к вычислению",b:[
"К середине XX века нейрон описан как электрическая клетка.",
"Появляется соблазн: а можно ли его смоделировать?",
"Ответ придёт из кибернетики."]},

/* 31—50 · Кибернетика */
{s:"Кибернетика",t:"Что такое кибернетика",b:[
"Наука об управлении и связи в живых и машинах.",
"Название происходит от греческого «кормчий».",
"Она объединяет биологию, математику и инженерию."]},
{s:"Кибернетика",t:"Норберт Винер",b:[
"1948 год: Винер публикует «Кибернетику».",
"Он видит общее между нервной системой и вычислительной машиной.",
"Обратная связь — центральное понятие."]},
{s:"Кибернетика",t:"Кибернетика и нейроны",b:[
"Нейрон — элемент управления с входом, выходом и порогом.",
"Мозг — сеть, машина — тоже сеть.",
"Граница между живым и искусственным становится тонкой."]},
{s:"Кибернетика",t:"Мак-Каллок и Питтс",b:[
"1943 год: Уоррен Мак-Каллок и Уолтер Питтс публикуют модель нейрона.",
"Нейрон — логический элемент: суммирует входы и сравнивает с порогом.",
"Так рождается формальный нейрон."]},
{s:"Кибернетика",t:"Формальный нейрон",b:[
"Входы умножаются на веса и складываются.",
"Если сумма превышает порог — нейрон «срабатывает».",
"Одна строка формулы, из которой вырастет весь ИИ."]},
{s:"Кибернетика",t:"Логика из нейронов",b:[
"Мак-Каллок и Питтс показали: сеть нейронов может вычислять логические функции.",
"И, ИЛИ, НЕ — всё реализуется весами и порогами.",
"Мозг предстаёт вычислительной машиной."]},
{s:"Кибернетика",t:"Перцептрон Розенблатта",b:[
"1958 год: Фрэнк Розенблатт строит перцептрон — обучаемый классификатор.",
"Он учится на примерах, подстраивая веса.",
"Первая машина, которая «учится» на данных."]},
{s:"Кибернетика",t:"Ассоциатор",b:[
"Предшественник перцептрона, также созданный Розенблаттом.",
"Устройство для распознавания образов.",
"Оно привлекло внимание военных и прессы."]},
{s:"Кибернетика",t:"Mark I Perceptron",b:[

/* 51—65 · Анатомия */

{s:"Анатомия",t:"Сома — тело клетки",b:[

{s:"Анатомия",t:"Аксон",b:[

{s:"Анатомия",t:"Аксональный холмик",b:[

{s:"Анатомия",t:"Перехваты Ранвье",b:[

/* 66—83 · Электрофизиология */
{s:"Электрофизиология",t:"Ионные каналы",b:[

{s:"Электрофизиология",t:"Потенциал действия",b:[

{s:"Электрофизиология",t:"Фазы потенциала действия",b:[

{s:"Электрофизиология",t:"Реполяризация",b:[

{s:"Синапс",t:"Интеграция сигнала",b:[

{s:"Синапс",t:"Обратный захват",b:[

/* ================================
   РЕНДЕР И ЛОГИКА
   ================================ */
const stage   = document.getElementById('stage');
const totEl   = document.getElementById('tot');
const curEl   = document.getElementById('cur');
const sectEl  = document.getElementById('sect');
const chapter = document.getElementById('chapter');
const pb      = document.getElementById('pb');
const hint    = document.getElementById('hint');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
const zones   = document.querySelectorAll('.tapzones > div[data-dir]');

totEl.textContent = slides.length;

const nodes = slides.map((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide bg-' + (i % 4);
  const ps = s.b.map(l => `<p>${l}</p>`).join('');
  el.innerHTML = `<div class="inner">
    <div class="kicker">${s.s}</div>
    <h2 class="title">${s.t}</h2>
    <div class="body">${ps}</div>
  </div>`;
  stage.appendChild(el);
  return el;
});

/* Мягкий prefetch соседних слайдов, чтобы анимация была плавной */
nodes.forEach(n=>{ n.style.backfaceVisibility='hidden'; });

let idx = 0;
const STORE_KEY = 'neuro-slide-idx';

function show(i, save=true){
  i = Math.max(0, Math.min(slides.length-1, i));
  nodes.forEach((n,k)=>{ if(k!==i) n.classList.remove('active'); });
  nodes[i].classList.add('active');
  idx = i;
  curEl.textContent   = i+1;
  sectEl.textContent  = slides[i].s;
  chapter.textContent = slides[i].s;
  pb.style.width = ((i+1)/slides.length*100).toFixed(2) + '%';
  prevBtn.disabled = i===0;
  nextBtn.disabled = i===slides.length-1;
  if(save){ try{ localStorage.setItem(STORE_KEY, String(i)); }catch(e){} }
}

/* Восстановление позиции */
let restored = 0;
try{ restored = parseInt(localStorage.getItem(STORE_KEY)||'0',10)||0; }catch(e){}
show(restored, false);

/* Кнопки */
prevBtn.addEventListener('click', ()=> show(idx-1));
nextBtn.addEventListener('click', ()=> show(idx+1));

/* Тап-зоны */
zones.forEach(z=>{
  z.addEventListener('click', e=>{
    e.stopPropagation();
    const dir = parseInt(z.dataset.dir,10);
    show(idx + dir);
    hideHint();
  });
});

/* Свайпы — pointer events для единой обработки touch/mouse */
let sx=0, sy=0, st=0, tracking=false;
const SWIPE_MIN = 42;         /* минимальный сдвиг по X, px */
const SWIPE_MAX_Y = 70;       /* ограничение по Y, чтобы вертикальный скролл не мешал */
const SWIPE_TIME = 700;       /* окно времени, мс */

stage.addEventListener('pointerdown', e=>{
  tracking = true;
  sx = e.clientX; sy = e.clientY; st = performance.now();
}, {passive:true});

stage.addEventListener('pointerup', e=>{
  if(!tracking) return;
  tracking = false;
  const dx = e.clientX - sx;
  const dy = e.clientY - sy;
  const dt = performance.now() - st;
  if(dt > SWIPE_TIME) return;
  if(Math.abs(dx) < SWIPE_MIN) return;
  if(Math.abs(dy) > SWIPE_MAX_Y) return;
  show(idx + (dx < 0 ? 1 : -1));
  hideHint();
});

stage.addEventListener('pointercancel', ()=>{ tracking=false; });

/* Клавиатура — для десктопной проверки */
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){ e.preventDefault(); show(idx+1); hideHint(); }
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); show(idx-1); hideHint(); }
  else if(e.key==='Home'){ e.preventDefault(); show(0); hideHint(); }
  else if(e.key==='End'){ e.preventDefault(); show(slides.length-1); hideHint(); }
});

/* Подсказка исчезает после первого действия */
let hinted = false;
function hideHint(){ if(!hinted){ hinted = true; hint.classList.add('fade'); } }
setTimeout(hideHint, 7000);

/* Запрет двойного тапа-зума (iOS) */
let lastTouch = 0;
document.addEventListener('touchend', e=>{
  const now = Date.now();
  if(now - lastTouch < 320) e.preventDefault();
  lastTouch = now;
}, {passive:false});

/* Предотвращение bounce (pull-to-refresh) */
document.addEventListener('touchmove', e=>{
  if(e.touches.length === 1) e.preventDefault();
}, {passive:false});

/* При возврате на вкладку — снова показать текущий слайд (iOS восстанавливает скролл) */
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden) show(idx, false);
});
